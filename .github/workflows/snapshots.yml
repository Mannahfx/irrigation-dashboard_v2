name: Record Sensor Snapshots

on:
  schedule:
    # Testing schedule: 12:50 PM UTC+1 (11:50 UTC)
    # UTC times: 7, 9, 11, 13, 15, 17
    - cron: '50 11 * * *'
  workflow_dispatch: # Allows manual testing from GitHub Actions tab

jobs:
  record-snapshots:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run snapshot recorder
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_MQTT_BROKER: ${{ secrets.VITE_MQTT_BROKER }}
          VITE_MQTT_USERNAME: ${{ secrets.VITE_MQTT_USERNAME }}
          VITE_MQTT_PASSWORD: ${{ secrets.VITE_MQTT_PASSWORD }}
        run: node scripts/record-snapshots.js
